# Prod: nginx serves the Vite build and proxies /api to FastAPI.
# Dev still uses `vite --port 5173` (proxy in vite.config.js).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://ecommerce-api:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
